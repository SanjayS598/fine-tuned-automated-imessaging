[project]
name = "fine-tuned-automated-imessaging"
version = "0.1.0"
description = "Local, contact-controlled iMessage replies fine-tuned on your messages"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
mac = [
    "mlx-lm[train]>=0.28.4,<0.32",
    "pyobjc-framework-Cocoa>=10; sys_platform == 'darwin'",
    "pyobjc-framework-contacts>=10",
]

[project.scripts]
imessage-bot = "imessage_bot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/imessage_bot"]
